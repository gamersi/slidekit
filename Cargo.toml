[package]
name = "slidekit"
version = "0.2.0"
edition = "2024"
description = "Build PDF, handout and an offline HTML player with presenter view from a Typst deck"
license = "MIT"

[dependencies]
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-render = "0.15.1"
typst-layout = "0.15.1"
typst-kit = { version = "0.15.1", features = [
    "embedded-fonts",
    "scan-fonts",
    "system-files",
    "system-downloader",
    "emit-diagnostics",
    "datetime",
] }
comemo = "0.5"
rayon = "1"
jpeg-encoder = "0.6"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
notify = "8"
notify-debouncer-mini = "0.7"
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
