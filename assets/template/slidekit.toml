[deck]
entry = "slides.typ"
title = "My talk"
# root = "."              # typst project root (may be a parent dir)
# fonts = ["fonts"]       # extra font directories
# system-fonts = false    # also use installed fonts
# inputs = { }            # extra sys.inputs

[output]
dir = "dist"
# pdf = "slides.pdf"      # "" disables
# handout = "handout.pdf" # "" disables; compiled with sys.inputs.slidekit-mode = "handout"
# html = "index.html"     # "" disables
# images = "auto"         # auto (svg, jpeg for pages with images) | svg | jpeg
# ppi = 216               # jpeg pages only
# jpeg-quality = 92       # jpeg pages only

[player]
# transition = "fade"     # none | fade | slide | cover | zoom | wipe
# transition-duration = 0.35
# progress = false        # progress bar along the bottom
# loop = false            # start over after the last slide
# advance = 0             # auto-advance every n seconds (0 = off)
